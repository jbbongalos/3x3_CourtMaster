{% extends "layout.html" %}
{% block content %}
<div class="dashboard-wrapper animate__animated animate__fadeIn">
    
    <div class="hero-section">
        <h1 class="hero-title">3&times;3 LEAGUE <span class="accent">CONTROL</span></h1>
        <p class="hero-subtitle">
            Advanced management for elite 3&times;3 basketball tournaments. 
            Track rosters, manage teams, and log game results in real-time.
        </p>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h2 class="stat-number">{{ p_count }}</h2>
            <p class="stat-label">ATHLETES REGISTERED</p>
        </div>

        <div class="stat-card">
            <h2 class="stat-number">{{ t_count }}</h2>
            <p class="stat-label">PRO TEAMS</p>
        </div>

        <div class="stat-card">
            <h2 class="stat-number">{{ g_count }}</h2>
            <p class="stat-label">GAMES TRACKED</p>
        </div>
    </div>
</div>
{% endblock %}
