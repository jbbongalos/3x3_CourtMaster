{% extends "layout.html" %}
{% block content %}
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-warning"><h3>Edit Player Profile</h3></div>
        <div class="card-body">
            <form method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>First Name</label>
                        <input type="text" name="first_name" class="form-control" value="{{ player.first_name }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Last Name</label>
                        <input type="text" name="last_name" class="form-control" value="{{ player.last_name }}" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label>Jersey Number</label>
                        <input type="number" name="jersey_number" class="form-control" value="{{ player.jersey_number }}" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label>Position</label>
                        <select name="position" class="form-control">
                            <option value="Guard" {% if player.position == 'Guard' %}selected{% endif %}>Guard</option>
                            <option value="Forward" {% if player.position == 'Forward' %}selected{% endif %}>Forward</option>
                            <option value="Center" {% if player.position == 'Center' %}selected{% endif %}>Center</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label>Team</label>
                        <select name="team_id" class="form-control">
                            {% for team in teams %}
                            <option value="{{ team.team_id }}" {% if team.team_id == player.team_id %}selected{% endif %}>
                                {{ team.team_name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-success">Update Player</button>
                <a href="{{ url_for('players') }}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
